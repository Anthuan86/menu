<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Menús - Por Segmento y Usuario</title>
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .menu-preview {
            background: #1e293b;
            color: white;
            border-radius: 8px;
            padding: 1.5rem;
            min-height: 400px;
        }

        .menu-preview h3 {
            color: white;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .menu-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .menu-item i {
            width: 20px;
            text-align: center;
        }

        .menu-item.parent {
            background: rgba(37, 99, 235, 0.2);
            font-weight: 600;
        }

        .menu-item.child {
            padding-left: 3rem;
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .menu-empty {
            text-align: center;
            padding: 3rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .menu-empty i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .comparison-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .user-info {
            background: var(--light-bg);
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .user-info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .user-info-label {
            font-weight: 600;
            color: var(--text-light);
        }

        .user-info-value {
            color: var(--text-dark);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>
                <i class="fas fa-eye"></i>
                Visualizador de Menús
            </h1>
            <div>
                <button class="btn btn-secondary" onclick="location.href='index.html'">
                    <i class="fas fa-arrow-left"></i>
                    Volver al Admin
                </button>
            </div>
        </div>
    </header>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchViewMode('segment')">
                <i class="fas fa-layer-group"></i> Por Segmento
            </button>
            <button class="tab" onclick="switchViewMode('user')">
                <i class="fas fa-user"></i> Por Usuario
            </button>
            <button class="tab" onclick="switchViewMode('comparison')">
                <i class="fas fa-columns"></i> Comparar Segmentos
            </button>
        </div>

        <!-- Segment View -->
        <div id="view-segment" class="tab-content active">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Vista de Menú por Segmento</h3>
                </div>

                <div class="segment-pills">
                    <button class="segment-pill active" onclick="viewSegmentMenu('colaborador')">
                        <i class="fas fa-user-tie"></i> Colaboradores
                    </button>
                    <button class="segment-pill" onclick="viewSegmentMenu('cliente')">
                        <i class="fas fa-user"></i> Clientes
                    </button>
                    <button class="segment-pill" onclick="viewSegmentMenu('partner')">
                        <i class="fas fa-handshake"></i> Partners
                    </button>
                </div>

                <div class="menu-preview" id="segment-menu-preview">
                    <h3 id="segment-menu-title">Menú de Colaboradores</h3>
                    <div id="segment-menu-items">
                        <div class="menu-empty">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Cargando menú...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- User View -->
        <div id="view-user" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Vista de Menú por Usuario</h3>
                </div>

                <div class="form-group">
                    <label class="form-label">Seleccionar Segmento</label>
                    <select class="form-select" id="user-segment" onchange="loadUsersForViewer()">
                        <option value="">-- Seleccione un segmento --</option>
                        <option value="colaborador">Colaboradores</option>
                        <option value="cliente">Clientes</option>
                        <option value="partner">Partners</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Seleccionar Usuario</label>
                    <select class="form-select" id="user-select" onchange="viewUserMenu()">
                        <option value="">-- Seleccione un usuario --</option>
                    </select>
                </div>

                <div id="user-menu-container" style="display: none;">
                    <div class="user-info" id="user-info-box">
                        <!-- User info will be loaded here -->
                    </div>

                    <div class="menu-preview">
                        <h3>Menú Personalizado del Usuario</h3>
                        <div id="user-menu-items">
                            <!-- Menu items will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Comparison View -->
        <div id="view-comparison" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">Comparación de Menús por Segmento</h3>
                </div>

                <div class="comparison-grid">
                    <div>
                        <div class="menu-preview">
                            <h3>
                                <i class="fas fa-user-tie"></i>
                                Colaboradores
                            </h3>
                            <div id="comparison-colaborador">
                                <!-- Menu will be loaded here -->
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="menu-preview">
                            <h3>
                                <i class="fas fa-user"></i>
                                Clientes
                            </h3>
                            <div id="comparison-cliente">
                                <!-- Menu will be loaded here -->
                            </div>
                        </div>
                    </div>

                    <div>
                        <div class="menu-preview">
                            <h3>
                                <i class="fas fa-handshake"></i>
                                Partners
                            </h3>
                            <div id="comparison-partner">
                                <!-- Menu will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '../api';

        // Utility Functions
        function showLoading(show = true) {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.classList.toggle('active', show);
            }
        }

        function showAlert(message, type = 'info') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            alertDiv.style.position = 'fixed';
            alertDiv.style.top = '20px';
            alertDiv.style.right = '20px';
            alertDiv.style.zIndex = '9999';

            document.body.appendChild(alertDiv);

            setTimeout(() => {
                alertDiv.style.transition = 'opacity 0.3s ease';
                alertDiv.style.opacity = '0';
                setTimeout(() => alertDiv.remove(), 300);
            }, 3000);
        }

        async function fetchAPI(endpoint) {
            try {
                const response = await fetch(`${API_BASE_URL}/${endpoint}`);
                const data = await response.json();

                if (!data.success) {
                    throw new Error(data.message || 'Error en la petición');
                }

                return data.data;
            } catch (error) {
                console.error('API Error:', error);
                showAlert(error.message, 'danger');
                throw error;
            }
        }

        // View Mode Switching
        function switchViewMode(mode) {
            // Update tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`view-${mode}`).classList.add('active');

            // Load data
            if (mode === 'segment') {
                viewSegmentMenu('colaborador');
            } else if (mode === 'comparison') {
                loadComparison();
            }
        }

        // Segment View
        async function viewSegmentMenu(segment) {
            // Update active pill
            document.querySelectorAll('#view-segment .segment-pill').forEach(pill => {
                pill.classList.remove('active');
            });
            event.target.classList.add('active');

            const title = document.getElementById('segment-menu-title');
            const container = document.getElementById('segment-menu-items');

            const labels = {
                'colaborador': 'Colaboradores',
                'cliente': 'Clientes',
                'partner': 'Partners'
            };

            title.textContent = `Menú de ${labels[segment]}`;

            showLoading(true);

            try {
                const modules = await fetchAPI(`modules.php?action=hierarchy&segment=${segment}&only_active=true`);
                renderMenu(container, modules);
            } catch (error) {
                container.innerHTML = `
                    <div class="menu-empty">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>Error al cargar el menú</p>
                    </div>
                `;
            } finally {
                showLoading(false);
            }
        }

        // User View
        async function loadUsersForViewer() {
            const segment = document.getElementById('user-segment').value;
            const userSelect = document.getElementById('user-select');

            userSelect.innerHTML = '<option value="">-- Seleccione un usuario --</option>';
            document.getElementById('user-menu-container').style.display = 'none';

            if (!segment) return;

            showLoading(true);

            try {
                const users = await fetchAPI(`users.php?segment=${segment}`);

                users.forEach(user => {
                    const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim();
                    const option = document.createElement('option');
                    option.value = user.id;
                    option.dataset.user = JSON.stringify(user);
                    option.textContent = `${fullName} (${user.email})`;
                    userSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading users:', error);
            } finally {
                showLoading(false);
            }
        }

        async function viewUserMenu() {
            const userSelect = document.getElementById('user-select');
            const userId = userSelect.value;
            const userType = document.getElementById('user-segment').value;

            if (!userId || !userType) {
                document.getElementById('user-menu-container').style.display = 'none';
                return;
            }

            const selectedOption = userSelect.options[userSelect.selectedIndex];
            const user = JSON.parse(selectedOption.dataset.user);

            // Show user info
            const userInfoBox = document.getElementById('user-info-box');
            const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim();
            const account = user.accountname || user.user_name || '-';

            userInfoBox.innerHTML = `
                <div class="user-info-item">
                    <span class="user-info-label">Nombre:</span>
                    <span class="user-info-value">${fullName}</span>
                </div>
                <div class="user-info-item">
                    <span class="user-info-label">Email:</span>
                    <span class="user-info-value">${user.email}</span>
                </div>
                <div class="user-info-item">
                    <span class="user-info-label">Cuenta:</span>
                    <span class="user-info-value">${account}</span>
                </div>
                <div class="user-info-item">
                    <span class="user-info-label">Tipo:</span>
                    <span class="user-info-value badge badge-info">${getSegmentLabel(userType)}</span>
                </div>
            `;

            showLoading(true);

            try {
                const menu = await fetchAPI(`permissions.php?action=menu&user_id=${userId}&user_type=${userType}`);
                const container = document.getElementById('user-menu-items');
                renderMenu(container, menu);
                document.getElementById('user-menu-container').style.display = 'block';
            } catch (error) {
                console.error('Error loading user menu:', error);
            } finally {
                showLoading(false);
            }
        }

        // Comparison View
        async function loadComparison() {
            showLoading(true);

            try {
                const segments = ['colaborador', 'cliente', 'partner'];

                for (const segment of segments) {
                    const modules = await fetchAPI(`modules.php?action=hierarchy&segment=${segment}&only_active=true`);
                    const container = document.getElementById(`comparison-${segment}`);
                    renderMenu(container, modules);
                }
            } catch (error) {
                console.error('Error loading comparison:', error);
            } finally {
                showLoading(false);
            }
        }

        // Render Menu
        function renderMenu(container, items) {
            if (!items || items.length === 0) {
                container.innerHTML = `
                    <div class="menu-empty">
                        <i class="fas fa-inbox"></i>
                        <p>No hay módulos disponibles</p>
                    </div>
                `;
                return;
            }

            let html = '';

            items.forEach(item => {
                html += renderMenuItem(item);
            });

            container.innerHTML = html;
        }

        function renderMenuItem(item, isChild = false) {
            const hasChildren = item.children && item.children.length > 0;

            let html = `
                <div class="menu-item ${isChild ? 'child' : 'parent'}">
                    ${item.icon ? `<i class="fas ${item.icon}"></i>` : '<i class="fas fa-circle"></i>'}
                    <span>${item.name}</span>
                </div>
            `;

            if (hasChildren) {
                item.children.forEach(child => {
                    html += renderMenuItem(child, true);
                });
            }

            return html;
        }

        function getSegmentLabel(segment) {
            const labels = {
                'colaborador': 'Colaborador',
                'cliente': 'Cliente',
                'partner': 'Partner'
            };
            return labels[segment] || segment;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Load default segment menu
            setTimeout(() => {
                const firstPill = document.querySelector('#view-segment .segment-pill');
                if (firstPill) {
                    firstPill.click();
                }
            }, 100);
        });
    </script>
</body>
</html>
